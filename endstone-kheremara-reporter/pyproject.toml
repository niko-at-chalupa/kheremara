[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-kheremara-reporter"
version = "0.1.0"
authors = [
    { name = "niko-at-chalupa"}
]
dependencies = [
    "aiohttp>=3.14.3",
    "endstone",
]
[project.entry-points."endstone"]
kheremara_reporter = "endstone_kheremara_reporter:Reporter"

[tool.hatch.build.targets.wheel]
packages = ["src/endstone_kheremara_reporter"]
